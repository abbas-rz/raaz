<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .pair { flex: 1; padding: 90px 52px; display: flex; flex-direction: column; gap: 40px; }
  .pair h2 { font-family: "Baloo 2"; font-weight: 800; font-size: 64px; line-height: 1; }
  .code { background: var(--marigold); color: var(--marigold-ink); border-radius: 48px; padding: 44px 20px 30px; text-align: center; font-family: "Baloo 2"; font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: 6px; transform: rotate(-2deg); }
  .emoji { display: flex; justify-content: space-between; background: var(--aubergine); border-radius: 48px; padding: 40px 56px; font-size: 88px; line-height: 1; }
  .ok { background: var(--marigold); color: var(--marigold-ink); border-radius: 60px; height: 112px; display: grid; place-items: center; font-weight: 600; font-size: 38px; }
  .note { color: var(--lilac); font-size: 30px; line-height: 1.35; text-align: center; padding: 0 20px; }
</style></head><body>
<div class="canvas slide">
  <div class="brand"><svg viewBox="0 0 64 64"><defs><clipPath id="c3"><circle cx="24" cy="32" r="16"/></clipPath></defs><circle cx="24" cy="32" r="16" fill="#e5307e"/><circle cx="40" cy="32" r="16" fill="#a996c4"/><circle cx="40" cy="32" r="16" fill="#ffb627" clip-path="url(#c3)"/><circle cx="32" cy="28.6" r="2.9" fill="#1f1030"/><path d="M30.7 30.2 L29.7 38 H34.3 L33.3 30.2 Z" fill="#1f1030"/></svg>raaz</div>
  <h1>No number. Just a code.</h1>
  <p class="sub">One of you shares a code, the other types it in. Same four emoji on both phones means you're connected.</p>
  <div class="phone"><div class="screen">
    <div class="pair">
      <div class="code">P094-FCR5</div>
      <h2>Check these match</h2>
      <div class="emoji"><span>💎</span><span>🎸</span><span>🍄</span><span>🎯</span></div>
      <div class="ok">They match</div>
      <p class="note">The code works once and expires in 15 minutes. No phone number, email or name is ever asked for.</p>
    </div>
  </div></div>
</div>
</body></html>
