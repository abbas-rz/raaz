<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .banner { width: 1280px; height: 640px; padding: 0 88px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .banner .brand { font-size: 160px; gap: 30px; line-height: .8; }
  .banner .brand svg { width: 170px; height: 170px; }
  .banner .sub { font-size: 38px; max-width: 460px; }
  .tags { display: flex; flex-wrap: wrap; gap: 14px; max-width: 540px; }
  .tags span { border: 2px solid var(--line); border-radius: 40px; padding: 6px 22px; font-size: 24px; }
  .banner .phone { left: auto; right: 110px; transform: rotate(7deg) scale(.52); transform-origin: top right; top: 70px; bottom: auto; height: 1240px; border-radius: 92px; }
  .banner .screen { border-radius: 72px; }
</style></head><body>
<div class="canvas banner">
  <div class="brand"><svg viewBox="0 0 64 64"><defs><clipPath id="b1"><circle cx="24" cy="32" r="16"/></clipPath></defs><circle cx="24" cy="32" r="16" fill="#e5307e"/><circle cx="40" cy="32" r="16" fill="#a996c4"/><circle cx="40" cy="32" r="16" fill="#ffb627" clip-path="url(#b1)"/><circle cx="32" cy="28.6" r="2.9" fill="#1f1030"/><path d="M30.7 30.2 L29.7 38 H34.3 L33.3 30.2 Z" fill="#1f1030"/></svg>raaz</div>
  <p class="sub">A private space for just the two of you.</p>
  <div class="tags"><span>End-to-end encrypted</span><span>View-once snaps</span><span>No account</span></div>
  <div class="phone"><div class="screen">
    <div class="bar"><div class="avatar">A</div><div class="who"><b>Ananya</b><span>here now</span></div></div>
    <div class="log">
      <div class="b them">canteen at 5? 🍟</div>
      <div class="b me">haan 5 baje, see you 🙈<span class="react">❤️</span></div>
      <div class="marker">Ananya is thinking of you</div>
      <div class="snaptile"><i>✦</i><span><b>Tap to open</b><small>View once · 5s</small></span></div>
      <div class="b them">bring my notes pls 📚</div>
    </div>
  </div></div>
</div>
</body></html>
